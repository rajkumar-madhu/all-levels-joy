# Template only — do not fill in real values here or commit them. Create the actual
# Secret imperatively instead, e.g.:
#
#   kubectl -n itsm create secret generic itsm-supabase \
#     --from-literal=SUPABASE_URL=... \
#     --from-literal=SUPABASE_PUBLISHABLE_KEY=... \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#     --from-literal=LOVABLE_API_KEY=...
#
# SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are the same public values already committed
# in this repo's .env (they're inlined into the client bundle at build time, but the server
# middleware in src/integrations/supabase/auth-middleware.ts also reads them from
# process.env at runtime, so the running container needs them too).
#
# SUPABASE_SERVICE_ROLE_KEY and LOVABLE_API_KEY are real secrets — pull them from the
# Lovable Cloud project settings; they are never checked into this repo.
apiVersion: v1
kind: Secret
metadata:
  name: itsm-supabase
  namespace: itsm
type: Opaque
stringData:
  SUPABASE_URL: "REPLACE_ME"
  SUPABASE_PUBLISHABLE_KEY: "REPLACE_ME"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  LOVABLE_API_KEY: "REPLACE_ME"
