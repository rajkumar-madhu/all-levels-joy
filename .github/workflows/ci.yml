name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Same checks as the README's validated local workflow.
      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      # ~2.8k pre-existing prettier errors (fixable with `bun run format`).
      # Reported but non-blocking until the tree is formatted; then drop
      # continue-on-error.
      - name: Lint
        continue-on-error: true
        run: bun run lint
