# Production stack: PostgreSQL 16, Redis 7, Keycloak, OPA, Django API, Celery worker and beat, and Caddy
# serving the React app with automatic HTTPS. Run from the repository root:
#   cp deploy/.env.example deploy/.env   # fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# See deploy/README.md for DNS, first admin, backups and upgrades.
name: argus

x-api-env: &api-env
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN},api,localhost
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  APP_PUBLIC_URL: https://${APP_DOMAIN}
  POSTGRES_HOST: postgres
  POSTGRES_DB: itsm
  POSTGRES_USER: itsm_api
  POSTGRES_PASSWORD: ${ITSM_DB_PASSWORD:?set ITSM_DB_PASSWORD}
  # Tokens carry the public issuer; signing keys are fetched over the internal network.
  KEYCLOAK_ISSUER: https://${AUTH_DOMAIN}/realms/itsm
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/itsm/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: itsm-api
  OPA_URL: http://opa:8181
  REDIS_URL: redis://redis:6379/0
  PAM_MASTER_KEY: ${PAM_MASTER_KEY:?set PAM_MASTER_KEY}
  PAM_ROTATION_BACKEND: ${PAM_ROTATION_BACKEND:-live}
  PAM_SSH_KNOWN_HOSTS: ${PAM_SSH_KNOWN_HOSTS:-}
  PAM_DB_SSLMODE: ${PAM_DB_SSLMODE:-require}
  PAM_DB_SSL_CA: ${PAM_DB_SSL_CA:-}
  PAM_WINRM_CA: ${PAM_WINRM_CA:-}
  MONITORING_WEBHOOK_TOKEN: ${MONITORING_WEBHOOK_TOKEN:-}
  PAGERDUTY_WEBHOOK_SECRET: ${PAGERDUTY_WEBHOOK_SECRET:-}
  SECURITY_SCANNER_SECRET: ${SECURITY_SCANNER_SECRET:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
  INTEGRATION_ORG_ID: ${INTEGRATION_ORG_ID:-10000000-0000-0000-0000-000000000001}
  PORTAL_ORG_ID: ${PORTAL_ORG_ID:-10000000-0000-0000-0000-000000000001}
  PORTAL_EMAIL_DOMAIN: ${PORTAL_EMAIL_DOMAIN:-wecrew.in}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Argus Service Desk <no-reply@localhost>}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
  EVIDENCE_STORAGE: ${EVIDENCE_STORAGE:-filesystem}
  EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
  EVIDENCE_S3_ENDPOINT_URL: ${EVIDENCE_S3_ENDPOINT_URL:-}
  EVIDENCE_S3_REGION: ${EVIDENCE_S3_REGION:-}
  EVIDENCE_S3_ACCESS_KEY_ID: ${EVIDENCE_S3_ACCESS_KEY_ID:-}
  EVIDENCE_S3_SECRET_ACCESS_KEY: ${EVIDENCE_S3_SECRET_ACCESS_KEY:-}

x-api: &api
  build:
    context: ..
    dockerfile: deploy/api.Dockerfile
  image: argus-api:latest
  environment: *api-env
  restart: unless-stopped
  volumes:
    - evidence:/app/var/evidence
    - ${PAM_SECRETS_DIR:-./pam}:/run/pam:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      ITSM_DB_PASSWORD: ${ITSM_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm file on first import.
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./keycloak/realm-itsm.json:/opt/keycloak/data/import/realm-itsm.json:ro
    # Admin console over an SSH tunnel only: ssh -L 8081:127.0.0.1:8081 <host>, then http://localhost:8081/admin
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  opa:
    image: openpolicyagent/opa:1.4.2
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ../backend/policies:/policies:ro

  # Applies Django migrations, the legacy Supabase/Drizzle schema and backend SQL, then exits.
  migrate:
    <<: *api
    restart: "no"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py apply_legacy_schema &&
             python manage.py apply_app_schema &&
             python manage.py sync_portal_workspace"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api
    depends_on:
      migrate: { condition: service_completed_successfully }
      opa: { condition: service_started }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  worker:
    <<: *api
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  beat:
    <<: *api
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_OIDC_AUTHORITY: https://${AUTH_DOMAIN}/realms/itsm
    image: argus-web:latest
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      KEYCLOAK_ADMIN_CIDRS: ${KEYCLOAK_ADMIN_CIDRS:-127.0.0.1/32}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api, keycloak]

volumes:
  pgdata:
  redisdata:
  evidence:
  caddydata:
  caddyconfig:
