apiVersion: v1
kind: Service
metadata:
  name: local-supabase
  namespace: all-levels-joy
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 54321
---
apiVersion: v1
kind: Endpoints
metadata:
  name: local-supabase
  namespace: all-levels-joy
subsets:
  - addresses:
      - ip: 172.16.2.1
    ports:
      - name: http
        port: 54321
